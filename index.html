<style>
:root{
  --ink:#152B27;

body{

/* ================= NAV ================= */

nav{
  position:sticky;

.nav-actions{

.nav-btn,

.nav-btn{

/* ================= HERO ================= */

.hero{

}

.hero-inner{

/* ================= EMPTY ================= */

.empty{

footer{

/* ================= TOAST ================= */

#toastBox{

<script>

/* =========================================================
   SUPABASE
   =========================================================

   ضع بيانات مشروعك هنا.

   من Supabase:
   Project Settings
   → API
   → Project URL
   → Publishable key / anon key

   لا تستخدم service_role هنا.
========================================================= */

const SUPABASE_URL = "ضع_رابط_مشروع_Supabase_هنا";

const SUPABASE_KEY = "ضع_publishable_او_anon_key_هنا";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   SETTINGS
========================================================= */

const THEME_KEY = "zubair_theme";

const AVATAR_COLORS = [
  "#0C3B3C",
  "#12716B",
  "#B4923F",
  "#1B4D66",
  "#0F5C57"
];

let doctors = [];

let activeWard = "الكل";


/* =========================================================
   THEME
========================================================= */

const ICON_SUN = `
<circle cx="12" cy="12" r="4"/>
<path
d="M12 2v2
M12 20v2
M4.9 4.9l1.4 1.4
M17.7 17.7l1.4 1.4
M2 12h2
M20 12h2
M4.9 19.1l1.4-1.4
M17.7 6.3l1.4-1.4"
stroke-linecap="round"/>
`;

const ICON_MOON = `
<path
d="M20 14.5A8.5 8.5 0 119.5 4
a7 7 0 0010.5 10.5z"
stroke-linejoin="round"/>
`;


function applyTheme(theme){

  document.documentElement
    .setAttribute("data-theme",theme);

  document.getElementById("themeIcon")
    .innerHTML =
    theme === "dark"
    ? ICON_MOON
    : ICON_SUN;

  localStorage.setItem(
    THEME_KEY,
    theme
  );
}


function toggleTheme(){

  const current =
    document.documentElement
      .getAttribute("data-theme") === "dark"
      ? "dark"
      : "light";

  applyTheme(
    current === "dark"
    ? "light"
    : "dark"
  );
}


applyTheme(
  localStorage.getItem(THEME_KEY)
  || "light"
);


/* =========================================================
   TOAST
========================================================= */

function showToast(message,type){

  const box =
    document.getElementById("toastBox");

  const toast =
    document.createElement("div");

  toast.className =
    "toast" +
    (type === "error"
      ? " error"
      : "");

  toast.textContent = message;

  box.appendChild(toast);

  requestAnimationFrame(()=>{
    toast.classList.add("show");
  });

  setTimeout(()=>{

    toast.classList.remove("show");

    setTimeout(()=>{
      toast.remove();
    },300);

  },3000);
}


/* =========================================================
   CLOCK
========================================================= */

function tickClock(){

  const now = new Date();

  document.getElementById("clockTime")
    .textContent =
    now.toLocaleTimeString(
      "ar-IQ",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  document.getElementById("clockDate")
    .textContent =
    now.toLocaleDateString(
      "ar-IQ",
      {
        weekday:"long",
        year:"numeric",
        month:"long",
        day:"numeric"
      }
    );
}


tickClock();

setInterval(
  tickClock,
  1000
);


/* =========================================================
   DATA.JSON
========================================================= */

async function loadData(){

  try{

    const response =
      await fetch(
        "data.json",
        {
          cache:"no-store"
        }
      );

    if(!response.ok){
      throw new Error(
        "data.json not found"
      );
    }

    const json =
      await response.json();

    if(!Array.isArray(json)){
      throw new Error(
        "data.json invalid"
      );
    }

    doctors = json.map(d => ({

      id:d.id,

      name:d.name,

      ward:d.ward,

      call:d.call || "",

      wa:d.wa || "",

      rating:d.rating || 0,

      is_on_call:false

    }));


    /*
      بعد تحميل الأطباء من data.json
      نقرأ حالة الخفر الحالية من Supabase
    */

    await loadOnCall();

    renderAll();

  }catch(error){

    console.error(error);

    doctors = [];

    renderAll();

    showToast(
      "تعذر تحميل بيانات الأطباء",
      "error"
    );

  }

}


/* =========================================================
   LOAD CURRENT ON CALL
========================================================= */

async function loadOnCall(){

  /*
    إذا لم يتم وضع بيانات Supabase
    لا نحاول الاتصال.
  */

  if(
    SUPABASE_URL.includes("ضع_رابط")
    ||
    SUPABASE_KEY.includes("ضع_publishable")
  ){
    return;
  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("on_call")
    .select("*");


  if(error){

    console.error(
      "Supabase:",
      error
    );

    return;
  }


  /*
    تصفير الحالات
  */

  doctors.forEach(d=>{
    d.is_on_call = false;
  });


  /*
    وضع الخفر الحالي
  */

  data.forEach(row=>{

    const doctor =
      doctors.find(
        d =>
        Number(d.id) ===
        Number(row.doctor_id)
      );

    if(doctor){
      doctor.is_on_call = true;
    }

  });

}


/* =========================================================
   RENDER ALL
========================================================= */

function renderAll(){

  renderChips();

  renderPublic();

  fillDoctorSelect();

}


/* =========================================================
   WARD CHIPS
========================================================= */

function renderChips(){

  const wards = [
    "الكل",
    ...new Set(
      doctors
        .map(d=>d.ward)
        .filter(Boolean)
    )
  ];


  const box =
    document.getElementById(
      "wardChips"
    );

  box.innerHTML = "";


  wards.forEach(ward=>{

    const button =
      document.createElement(
        "button"
      );

    button.className =
      "chip" +
      (
        ward === activeWard
        ? " active"
        : ""
      );

    button.textContent =
      ward;

    button.onclick = ()=>{

      activeWard =
        ward;

      renderChips();

      renderPublic();

    };


    box.appendChild(button);

  });

}


/* =========================================================
   DOCTOR SELECT
========================================================= */

function fillDoctorSelect(){

  const select =
    document.getElementById(
      "doctorSelect"
    );

  if(!select) return;


  const oldValue =
    select.value;


  select.innerHTML = `
    <option value="">
      اختر اسم الطبيب
    </option>
  `;


  doctors.forEach(doctor=>{

    const option =
      document.createElement(
        "option"
      );

    option.value =
      doctor.id;

    option.textContent =
      `${doctor.name} — ${doctor.ward}`;

    select.appendChild(
      option
    );

  });


  if(
    doctors.some(
      d =>
      String(d.id) ===
      String(oldValue)
    )
  ){
    select.value =
      oldValue;
  }

}


/* =========================================================
   INITIALS
========================================================= */

function initials(name){

  const parts =
    name
      .trim()
      .split(/\s+/);

  return (
    (parts[0]?.[0] || "") +
    (parts[1]?.[0] || "")
  ).toUpperCase();

}


/* =========================================================
   COLOR
========================================================= */

function colorFor(str){

  let hash = 0;

  for(
    let i=0;
    i<str.length;
    i++
  ){

    hash =
      str.charCodeAt(i) +
      ((hash << 5) - hash);

  }

  return AVATAR_COLORS[
    Math.abs(hash) %
    AVATAR_COLORS.length
  ];

}


/* =========================================================
   STARS
========================================================= */

function starsHTML(rating){

  let html =
    '<span class="stars">';

  for(
    let i=1;
    i<=5;
    i++
  ){

    html +=
      i <= rating
      ? "★"
      : "☆";

  }

  html += "</span>";

  return html;

}


/* =========================================================
   ICONS
========================================================= */

const ICON_PHONE = `
<svg
viewBox="0 0 24 24"
width="15"
height="15">

<path
d="M22 16.9v3a2 2 0 01-2.2 2
19.8 19.8 0 01-8.6-3.1
19.5 19.5 0 01-6-6
A19.8 19.8 0 012.1 4.2
2 2 0 014.1 2h3
a2 2 0 012 1.7
c.1.9.3 1.8.6 2.7
a2 2 0 01-.5 2.1L8 9.7

/* =========================================================
   PUBLIC LIST
========================================================= */

function renderPublic(){

  const list =
    document.getElementById(
      "publicList"
    );


  let filtered =
    activeWard === "الكل"
    ? doctors
    : doctors.filter(
        d =>
        d.ward === activeWard
      );


  if(!filtered.length){

    list.innerHTML = `
      <div class="empty">
        لا يوجد أطباء حالياً.
      </div>
    `;

    return;

  }


  const groups = {};


  filtered.forEach(doctor=>{

    const ward =
      doctor.ward ||
      "غير محدد";

    if(!groups[ward]){
      groups[ward] = [];
    }

    groups[ward].push(
      doctor
    );

  });


  list.innerHTML =
    Object.entries(groups)
    .map(
      ([ward,docs])=>`

      <div class="ward-section">

        <div class="ward-title">

          <span class="dot"></span>

          خفر ${escapeHTML(ward)}

          <span class="ward-count">
            (${docs.length})
          </span>

        </div>


        <div class="cards">

          ${docs.map(
            doctor=>`

            <div class="
              card
              ${doctor.is_on_call
                ? "oncall"
                : ""}
            ">

              <div class="card-top">

                <div
                  class="avatar"
                  style="
                    background:${colorFor(
                      doctor.ward +
                      doctor.name
                    )}
                  ">

                  ${escapeHTML(
                    initials(
                      doctor.name
                    )
                  )}

                </div>


                <div>

                  <div class="doc-name">
                    ${escapeHTML(
                      doctor.name
                    )}
                  </div>

                  <div class="doc-ward">
                    ${escapeHTML(
                      doctor.ward
                    )}
                  </div>

                </div>

              </div>


              ${
                doctor.is_on_call
                ? `
                  <div class="oncall-badge">
                    🟢 الخفر المتواجد الآن
                  </div>
                `
                : ""
              }


              ${starsHTML(
                doctor.rating || 0
              )}


              <div class="actions">

                ${
                  doctor.call
                  ? `
                    <a
                      class="btn call"
                      href="tel:${escapeAttr(
                        doctor.call
                      )}">

                      ${ICON_PHONE}
                      اتصال

                    </a>
                  `
                  : `
                    <span class="btn disabled">
                      ${ICON_PHONE}
                      اتصال
                    </span>
                  `
                }


                ${
                  doctor.wa
                  ? `
                    <a
                      class="btn wa"
                      href="https://wa.me/${escapeAttr(
                        doctor.wa
                      )}"
                      target="_blank"
                      rel="noopener">

                      ${ICON_CHAT}
                      واتساب

                    </a>
                  `
                  : `
                    <span class="btn disabled">
                      ${ICON_CHAT}
                      واتساب
                    </span>
                  `
                }

              </div>

            </div>

          `
          ).join("")}

        </div>

      </div>

    `
    ).join("");

}


/* =========================================================
   SET ON CALL
========================================================= */

async function setOnCall(){

  const select =
    document.getElementById(
      "doctorSelect"
    );

  const button =
    document.getElementById(
      "onCallButton"
    );


  const doctorId =
    select.value;


  if(!doctorId){

    showToast(
      "اختر اسمك أولاً",
      "error"
    );

    return;

  }


  const doctor =
    doctors.find(
      d =>
      String(d.id) ===
      String(doctorId)
    );


  if(!doctor){

    showToast(
      "الطبيب غير موجود",
      "error"
    );

    return;

  }


  /*
    التأكد من إعداد Supabase
  */

  if(
    SUPABASE_URL.includes("ضع_رابط")
    ||
    SUPABASE_KEY.includes("ضع_publishable")
  ){

    showToast(
      "يجب ربط الموقع بـ Supabase أولاً",
      "error"
    );

    return;

  }


  button.disabled = true;

  button.textContent =
    "جاري تسجيل الخفر...";


  try{

    /*
      حذف الخفير السابق لنفس الردهة
    */

    const {
      error: deleteError
    } =
    await supabaseClient
      .from("on_call")
      .delete()
      .eq("ward",doctor.ward);


    if(deleteError){
      throw deleteError;
    }


    /*
      إضافة الخفير الجديد
    */

    const {
      error: insertError
    } =
    await supabaseClient
      .from("on_call")
      .insert({

        doctor_id:doctor.id,

        ward:doctor.ward,

        on_call_at:
          new Date()
          .toISOString()

      });


    if(insertError){
      throw insertError;
    }


    showToast(
      `تم تسجيل ${doctor.name} كخفر ${doctor.ward} 🟢`
    );


    await loadData();


  }catch(error){

    console.error(error);

    showToast(
      "حدث خطأ أثناء تسجيل الخفر",
      "error"
    );

  }


  button.disabled = false;

  button.textContent =
    "🟢 أنا الخفر اليوم";

}


/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return String(value ?? "")
    .replace(/"/g,"%22")
    .replace(/'/g,"%27");

}
